<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app_name }}</title>
<script>document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark";</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="topbar">
  <div class="logos">
    <div class="logo" title="TUP"><img src="{{ url_for('static', filename='img/tup.png') }}" alt="TUP" onerror="this.replaceWith(document.createTextNode('TUP'))"></div>
    <div class="logo" title="ACTS"><img src="{{ url_for('static', filename='img/acts.png') }}" alt="ACTS" onerror="this.replaceWith(document.createTextNode('ACTS'))"></div>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle dark or light theme">&#9681;</button>
</div>
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
{% block scripts %}{% endblock %}
</body></html>
